<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="26렌트카">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>26렌트카</title>
<style>
body{font-family:Arial,"Malgun Gothic",sans-serif;margin:0;background:#f3f4f6;color:#222}
header{background:#1f2937;color:white;padding:16px 20px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}
main{max-width:1000px;margin:25px auto;padding:0 12px}.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
input,button{font:inherit}input{padding:10px;border:1px solid #ccc;border-radius:7px}button{padding:10px 14px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer}
.hidden{display:none}.login{max-width:400px;margin:70px auto}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ddd;padding:7px}th{background:#f3f4f6}td input{width:95%;border:0}
.msg{font-size:13px;color:#555;margin-top:10px}
.install{background:#ecfeff;border:1px solid #a5f3fc;color:#155e75}
.install button{background:#0891b2}
@media(max-width:650px){.toolbar{flex-wrap:wrap}table{font-size:14px}}
</style>
</head>
<body>
<header><b>🚗 26렌트카</b><button id="logout" class="hidden">로그아웃</button></header>

<section id="login" class="card login">
<h2>관리자 로그인</h2>
<input id="email" type="email" placeholder="이메일" style="width:100%;box-sizing:border-box"><br><br>
<input id="password" type="password" placeholder="비밀번호" style="width:100%;box-sizing:border-box"><br><br>
<button id="loginBtn" style="width:100%">로그인</button>
<div id="loginMsg" class="msg"></div>
</section>

<main id="app" class="hidden">
<div id="installBox" class="card install hidden">
<b>📱 26렌트카를 휴대폰 앱처럼 설치할 수 있습니다.</b>
<div class="msg">아래 버튼을 누르면 홈 화면에 추가할 수 있습니다.</div>
<button id="installBtn">홈 화면에 추가</button>
</div>

<div class="card">
<div class="toolbar">
<button id="prev">◀ 이전날</button><b id="dateLabel"></b><button id="next">다음날 ▶</button>
</div><br>
<input id="date" type="date"><button id="today">오늘</button>
<div id="status" class="msg">준비 중...</div>
</div>

<div class="card">
<table><thead><tr><th>번호</th><th>배차</th><th>회차</th></tr></thead><tbody id="body"></tbody></table>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 기존에 정상 작동하던 Supabase 연결을 그대로 유지합니다. ===== */
const SUPABASE_URL = "https://ardrdgotlsvpwwskzxxr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8usX3aE07Z1deHDLMu_z5A_IzgLXIAx";

let client;
let day=new Date(); day.setHours(0,0,0,0);
const $=id=>document.getElementById(id);
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function rows(){
$("body").innerHTML="";
for(let i=1;i<=10;i++) $("body").insertAdjacentHTML("beforeend",
`<tr><td>${i}</td><td><input data-s="${i}" data-f="dispatch" placeholder="배차"></td><td><input data-s="${i}" data-f="round" placeholder="회차"></td></tr>`);
document.querySelectorAll("#body input").forEach(x=>x.addEventListener("input",()=>save(Number(x.dataset.s))));
}

async function load(){
const d=fmt(day); $("dateLabel").textContent=d; $("date").value=d; rows(); $("status").textContent="불러오는 중...";
const {data,error}=await client.from("dispatch_entries").select("slot,dispatch,round").eq("work_date",d).order("slot");
if(error){$("status").textContent="오류: "+error.message;return}
(data||[]).forEach(r=>{
const a=document.querySelector(`[data-s="${r.slot}"][data-f="dispatch"]`);
const b=document.querySelector(`[data-s="${r.slot}"][data-f="round"]`);
if(a)a.value=r.dispatch||""; if(b)b.value=r.round||"";
});
$("status").textContent="저장된 내용을 불러왔습니다.";
}

let timers={};
function save(slot){
clearTimeout(timers[slot]);
timers[slot]=setTimeout(async()=>{
const a=document.querySelector(`[data-s="${slot}"][data-f="dispatch"]`);
const b=document.querySelector(`[data-s="${slot}"][data-f="round"]`);
$("status").textContent=slot+"번 저장 중...";
const {error}=await client.from("dispatch_entries").upsert({
work_date:fmt(day),slot:slot,dispatch:a.value,round:b.value,updated_at:new Date().toISOString()
},{onConflict:"work_date,slot"});
$("status").textContent=error?"저장 오류: "+error.message:slot+"번 저장 완료";
},400);
}

$("loginBtn").onclick=async()=>{
if(!SUPABASE_URL.startsWith("http")){$("loginMsg").textContent="연결 설정을 확인하세요.";return}
client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const {error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
if(error){$("loginMsg").textContent="로그인 실패: "+error.message;return}
$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");await load();
};

$("logout").onclick=async()=>{await client.auth.signOut();location.reload()};
$("prev").onclick=()=>{day.setDate(day.getDate()-1);load()};
$("next").onclick=()=>{day.setDate(day.getDate()+1);load()};
$("today").onclick=()=>{day=new Date();day.setHours(0,0,0,0);load()};
$("date").onchange=()=>{let [y,m,d]=$("date").value.split("-").map(Number);day=new Date(y,m-1,d);load()};
rows();$("dateLabel").textContent=fmt(day);$("date").value=fmt(day);

/* ===== 휴대폰 앱 설치 기능 ===== */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
e.preventDefault();
deferredPrompt=e;
$("installBox").classList.remove("hidden");
});
$("installBtn").onclick=async()=>{
if(!deferredPrompt)return;
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt=null;
$("installBox").classList.add("hidden");
};
window.addEventListener("appinstalled",()=>$("installBox").classList.add("hidden"));

if("serviceWorker" in navigator){
window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
